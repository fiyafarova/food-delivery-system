{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Menu" %}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% trans "Menu" %}</h1>
<div class="row g-3">
  {% for item in items %}
  <div class="col-md-4">
    <div class="card h-100">
      <div class="card-body">
        <h2 class="h5 card-title">{{ item.name }}</h2>
        <p class="text-muted mb-1">{{ item.category }}</p>
        <p class="fw-bold">{{ item.price }} ₸</p>
        <button class="btn btn-primary" {% if not item.is_available %}disabled{% endif %}>
          {% if item.is_available %}{% trans "Add to cart" %}{% else %}{% trans "Not available" %}{% endif %}
        </button>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
