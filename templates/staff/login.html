{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Staff login" %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5">
        <h1 class="h3 mb-3">{% trans "Staff login" %}</h1>

        {% if form.non_field_errors %}
        <div class="alert alert-danger">{% trans "Wrong username or password." %}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
                <label class="form-label" for="id_username">{% trans "Username" %}</label>
                <input class="form-control" type="text" name="username" id="id_username"
                       value="{{ form.username.value|default:'' }}" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="id_password">{% trans "Password" %}</label>
                <input class="form-control" type="password" name="password" id="id_password" required>
            </div>
            <button class="btn btn-dark w-100" type="submit">{% trans "Log in" %}</button>
        </form>
    </div>
</div>
{% endblock %}
